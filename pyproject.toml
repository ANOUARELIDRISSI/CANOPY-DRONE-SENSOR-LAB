[project]
name = "drone-sensor-lab"
version = "0.1.0"
description = "Reproducible synthetic sensor collection and fire classification teaching lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.10,<4",
    "scikit-learn>=1.6,<2",
    "joblib>=1.4,<2",
    "streamlit>=1.42,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2,<3",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
drone-lab = "drone_lab.cli:main"
drone-live = "drone_lab.server:main"
drone-train = "drone_lab.train_csv:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_lab"]

[tool.ruff]
line-length = 100
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/drone_lab"]
ignore_missing_imports = true
check_untyped_defs = true
